[project]
name = "nanochat"
version = "0.1.0"
description = "a from-scratch LLM training stack: hand-written autograd, no deep learning framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "filelock>=3.19.0",
    "numpy>=1.26.0",
    "psutil>=7.1.0",
    "pyarrow>=21.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
# The Rust tokenizer stack. Not required: nanochat/bpe.py is a pure-Python BPE that
# handles both training and inference. Install this extra to opt into the fast backend
# via NANOCHAT_BPE_BACKEND=rust, to use Tokenizer.from_pretrained() (OpenAI's published
# vocabularies ship inside tiktoken), or to run the tests that check our BPE against
# these two as reference implementations.
fast-tokenizer = [
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv]
default-groups = []
